[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowshop-analyzer"
version = "0.1.0"
description = "C++/Python CLI tool to benchmark and visualize PFSP heuristics."
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
flowshop-analyzer = "flowshop_analyzer.cli:app"

[tool.hatch.build]
sources = ["python/src"]

[tool.hatch.build.targets.wheel]
packages = ["python/src/flowshop_analyzer"]
